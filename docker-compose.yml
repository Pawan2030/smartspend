services:
  backend:
    build: ./backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "@Pawan2030"
      POSTGRES_DB: smartspend
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: